name: Release

on:
  push:
    tags:
      - 'v*'
      - 'v*-rc*'
      - 'v*-beta*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Validate schema
        run: glib-compile-schemas --strict schemas/

      - name: Build extension zip
        run: |
          glib-compile-schemas schemas/
          zip -r auto-on-top.zip extension.js prefs.js metadata.json schemas/

      - name: Determine pre-release
        id: prerelease
        run: |
          if echo "${{ github.ref_name }}" | grep -qE '(rc|beta|alpha)'; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: auto-on-top.zip
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
          generate_release_notes: true
