name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate GSettings schema
        run: |
          glib-compile-schemas --strict schemas/

      - name: Validate metadata.json
        run: |
          python3 -c "
          import json, sys
          m = json.load(open('metadata.json'))
          required = ['name', 'uuid', 'shell-version', 'description']
          missing = [k for k in required if k not in m]
          if missing:
              print(f'Missing fields: {missing}', file=sys.stderr)
              sys.exit(1)
          print('metadata.json valid')
          "

      - name: Check JS syntax
        run: |
          node --check extension.js
          node --check prefs.js
